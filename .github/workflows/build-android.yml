name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      
      - name: Build
        env:
          ANDROID_HOME: ${{ env.ANDROID_SDK_ROOT }}
        run: |
          # Create project structure
          mkdir -p app/src/main/java/com/app
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/assets
          
          # Copy web files
          cp -r src/* app/src/main/assets/
          
          # Create build files
          echo 'plugins { id "com.android.application" version "8.1.0" }' > build.gradle
          echo 'android { namespace "com.app"; compileSdk 34; defaultConfig { applicationId "com.app"; minSdk 24; targetSdk 34; versionCode 1; versionName "1.0" } }' >> app/build.gradle
          echo 'rootProject.name = "app"' > settings.gradle
          echo 'include ":app"' >> settings.gradle
          
          # Create gradle wrapper
          gradle wrapper
          
          # Build
          chmod +x gradlew
          ./gradlew assembleDebug
      
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: app/build/outputs/apk/debug/*.apk