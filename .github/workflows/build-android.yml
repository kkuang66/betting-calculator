name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup
        run: |
          # Install Android command line tools
          sudo apt-get update
          sudo apt-get install -y wget unzip
          
          # Download Android SDK
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q commandlinetools-linux-11076708_latest.zip
          mkdir -p ~/android-sdk/cmdline-tools
          mv cmdline-tools ~/android-sdk/cmdline-tools/latest
          
          # Set environment
          echo "ANDROID_HOME=$HOME/android-sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$HOME/android-sdk" >> $GITHUB_ENV
          echo "$HOME/android-sdk/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$HOME/android-sdk/platform-tools" >> $GITHUB_PATH
          
          # Accept licenses
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-33" "build-tools;33.0.2"
      
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      
      - name: Build
        run: |
          mkdir -p app/src/main/java/com/app
          mkdir -p app/src/main/assets
          cp -r src/* app/src/main/assets/
          
          cat > app/src/main/java/com/app/MainActivity.java << 'EOF'
          package com.app;
          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          public class MainActivity extends Activity {
              @Override
              protected void onCreate(Bundle s) {
                  super.onCreate(s);
                  WebView w = new WebView(this);
                  setContentView(w);
                  w.getSettings().setJavaScriptEnabled(true);
                  w.getSettings().setDomStorageEnabled(true);
                  w.setWebViewClient(new WebViewClient());
                  w.loadUrl("file:///android_asset/index.html");
              }
          }
          EOF
          
          cat > app/src/main/AndroidManifest.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application android:label="Calculator">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF
          
          cat > build.gradle << 'EOF'
          buildscript {
              repositories { google(); mavenCentral() }
              dependencies { classpath "com.android.tools.build:gradle:7.4.2" }
          }
          allprojects { repositories { google(); mavenCentral() } }
          EOF
          
          cat > app/build.gradle << 'EOF'
          apply plugin: "com.android.application"
          android {
              namespace "com.app"
              compileSdk 33
              defaultConfig { applicationId "com.app"; minSdk 24; targetSdk 33 }
          }
          dependencies { implementation "androidx.appcompat:appcompat:1.6.1" }
          EOF
          
          echo 'rootProject.name="app"' > settings.gradle
          echo 'include ":app"' >> settings.gradle
          
          gradle wrapper --gradle-version 7.6.4
          chmod +x gradlew
          ./gradlew assembleDebug
      
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: app/build/outputs/apk/debug/*.apk